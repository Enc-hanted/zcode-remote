name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release 标签（如 v0.1.0）"
        required: true
        type: string
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ensure debug keystore
        # 与 build.yml 同策略：固定参数生成，签名一致可覆盖安装
        run: |
          if [ ! -f keystore/debug.keystore ]; then
            mkdir -p keystore
            keytool -genkeypair -v \
              -keystore keystore/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Rebuild embedded bundle + validate
        run: |
          python3 _patch_web2.py
          python3 _validate.py

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          cd app/build/outputs/apk/debug
          cp app-debug.apk ZCodeRemote-$TAG.apk
          gh release create "$TAG" ZCodeRemote-$TAG.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "ZCodeRemote $TAG" \
            --notes "ZCodeRemote debug 构建（固定签名，可直接覆盖安装）。" \
          || gh release upload "$TAG" ZCodeRemote-$TAG.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
