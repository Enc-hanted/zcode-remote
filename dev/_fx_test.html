<!DOCTYPE html><html class="dark theme-zai-dark"><head><meta name="viewport" content="width=369, initial-scale=1"><style>body{margin:0;background:#161616;height:100vh}</style></head>
<body>
<div style="height:60vh;background:#1a1a1a;color:#ddd">conversation area</div>
<div data-v4-composer-dock="true" class="pointer-events-none z-20 flex w-full justify-center sticky bottom-0" style="position:sticky;bottom:0;display:flex;width:100%;justify-content:center;pointer-events:none">
  <div data-testid="v4-composer" style="display:flex;width:100%;max-width:420px;background:#22252e;color:#eee;padding:12px;gap:8px">
    <input data-testid="v4-composer-input" style="flex:1;background:#16181f;color:#eee;border:none;padding:8px;border-radius:8px" placeholder="输入消息">
    <button data-testid="v4-composer-send" style="background:#333;color:#eee;border:none;border-radius:8px;padding:8px 14px">发送</button>
  </div>
</div>
<style>
@keyframes zcodeFadeUp{from{opacity:0;transform:translateX(-50%) translateY(16px)}to{opacity:1;transform:translateX(-50%)}}@keyframes zcodeFadeIn{from{opacity:0}to{opacity:1}}@keyframes zcodeFadePanel{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%)}}@keyframes zcodeFadeHint{from{opacity:0;transform:translateX(-50%) translateY(8px) scale(0.96)}to{opacity:1;transform:translateX(-50%)}}html.zcode-float-on [data-v4-composer-dock="true"]{display:none!important}html.zcode-float-on [data-v4-composer-dock="true"].zcode-composer-float{display:flex!important;position:fixed!important;left:50%!important;right:auto!important;bottom:14px!important;top:auto!important;transform:translateX(-50%)!important;width:min(94vw,440px)!important;max-width:none!important;height:auto!important;z-index:99998!important;pointer-events:auto!important;padding:10px!important;background:rgba(26,30,42,0.72)!important;-webkit-backdrop-filter:blur(24px) saturate(1.5)!important;backdrop-filter:blur(24px) saturate(1.5)!important;border:1px solid rgba(255,255,255,0.14)!important;border-radius:20px!important;box-shadow:0 18px 50px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.06)!important;animation:zcodeFadeUp 0.22s cubic-bezier(0.2,0.8,0.2,1);}html.zcode-float-on [data-v4-composer-dock="true"].zcode-composer-full{display:flex!important;position:fixed!important;left:0!important;right:0!important;bottom:0!important;top:0!important;transform:none!important;width:100%!important;max-width:none!important;height:100%!important;z-index:99998!important;pointer-events:auto!important;align-items:center!important;justify-content:center!important;padding:16px!important;background:rgba(16,19,29,0.88)!important;border-radius:0!important;border:none!important;-webkit-backdrop-filter:blur(28px) saturate(1.5)!important;backdrop-filter:blur(28px) saturate(1.5)!important;animation:zcodeFadeIn 0.18s ease-out;}.zcode-composer-full [data-testid="v4-composer"]{width:min(94vw,520px)!important;max-width:none!important;}.zcode-composer-full [data-testid^="v4-composer-input"]{min-height:24vh!important;}#zcode-composer-expand{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#E8ECF4;cursor:pointer;z-index:99999;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);box-shadow:0 2px 8px rgba(0,0,0,0.25);pointer-events:auto;
</style>
<script>
document.documentElement.classList.add('zcode-float-on');
var d = document.querySelector('[data-v4-composer-dock="true"]');
d.classList.add('zcode-composer-float');
window.__r = {display: getComputedStyle(d).display, pos: getComputedStyle(d).position, rect: d.getBoundingClientRect()};
</script>
</body></html>
