<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Logo 终稿（黑底绿字）</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background:#0a0a0a; color:#e5e5e5; margin:0; padding:32px; }
  h1 { font-size:22px; margin:0 0 6px; color:#4ade80; }
  .sub { color:#999; font-size:13px; margin-bottom:28px; }
  .row { display:flex; gap:28px; flex-wrap:wrap; }
  .card { background:#151515; border:1px solid #2a2a2a; border-radius:14px; padding:18px; text-align:center; width:330px; }
  .card h2 { font-size:15px; margin:0 0 4px; color:#4ade80; }
  .card .code { font-size:12px; color:#8a8a96; margin-bottom:14px; font-family:monospace; }
  .card .big { width:180px; height:180px; border-radius:20px; box-shadow:0 8px 24px rgba(0,0,0,.6); }
  .imgrow { display:flex; gap:10px; align-items:flex-end; justify-content:center; margin-top:12px; }
  .imgrow .sm { width:52px; height:52px; border-radius:12px; image-rendering:pixelated; box-shadow:0 4px 12px rgba(0,0,0,.5); }
  .cap { font-size:11px; color:#777; margin-top:6px; }
  .desc { font-size:12px; color:#bbb; margin-top:12px; line-height:1.6; text-align:left; }
</style>
</head>
<body>
  <h1>ZCode Launcher Icon · 黑底终端绿 Z 字母</h1>
  <div class="sub">提取官方标志的 Z 字母（深灰方块已丢弃），终端绿 #4ADE80 直接落在黑底上——黑底绿字，两个颜色</div>
  <div class="row">
    <div class="card"><h2>细笔画（官方原样）</h2><div class="code">#0A0A0A + #4ADE80</div>
      <img class="big" src="_logo_preview/thin_square.png">
      <div class="imgrow">
        <img class="sm" src="_logo_preview/thin_48.png">
        <img class="sm" src="_logo_preview/thin_circle.png">
      </div>
      <div class="cap">48px 圆角 / 圆形磁贴</div>
      <div class="desc">Z 字母忠实原样：细框 + 粗斜条，笔画忠于官方</div>
    </div>
    <div class="card"><h2>加粗笔画</h2><div class="code">#0A0A0A + #4ADE80（+2px 膨胀）</div>
      <img class="big" src="_logo_preview/bold_square.png">
      <div class="imgrow">
        <img class="sm" src="_logo_preview/bold_48.png">
        <img class="sm" src="_logo_preview/bold_circle.png">
      </div>
      <div class="cap">48px 圆角 / 圆形磁贴</div>
      <div class="desc">笔画整体加粗，小尺寸更醒目，斜条两端的分叉也更清楚</div>
    </div>
  </div>
</body>
</html>
