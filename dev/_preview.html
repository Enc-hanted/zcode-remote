<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZCodeRemote bundle 注入预览</title>
<style>
  /* ===== 模拟 z.ai 深色聊天页（近似观感，重点是注入 UI） ===== */
  * { box-sizing: border-box; }
  html, body { max-width: 100vw; overflow-x: hidden; }
  body { margin: 0; background: #0A0A0A; color: #F0F0F0; font-family: system-ui, -apple-system, sans-serif; }
  #app { max-width: 760px; margin: 0 auto; padding: 12px 14px 90px; }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 2px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  header .dot { width: 10px; height: 10px; border-radius: 50%; background: #34D399; }
  header span { font-size: 14px; color: #8F8F8F; }
  .row { display: flex; margin: 14px 0; }
  .row.user { justify-content: flex-end; }
  .row .bubble { max-width: 82%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .row.assistant .bubble { background: #1A1A1A; border: 1px solid rgba(255,255,255,0.08); border-top-left-radius: 4px; }
  .row.user .bubble { background: #2A2A2A; border-top-right-radius: 4px; }
  .row .ops { display: flex; gap: 6px; margin-top: 4px; }
  .row .ops button { font-size: 11px; color: #8B93A7; background: none; border: none; cursor: pointer; padding: 2px 4px; }
  code { background: rgba(255,255,255,0.07); padding: 1px 5px; border-radius: 5px; font-size: 12px; }

  /* ===== 输入 dock（模拟页面常驻底部输入框，注入后会被隐藏/悬浮化） ===== */
  [data-v4-composer-dock="true"] { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%);
    width: 100%; max-width: 760px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); }
  [data-v4-composer-dock="true"] [data-testid="v4-composer"] { background: #161616; border: 1px solid rgba(255,255,255,0.10); border-radius: 24px; }
  [data-v4-composer-dock="true"] .rounded-2xl { display: flex; align-items: flex-end; gap: 8px; padding: 8px 8px 8px 14px; border-radius: 18px; }
  [data-v4-composer-dock="true"] textarea { flex: 1; background: transparent; border: none; outline: none; resize: none;
    color: #F0F0F0; font-size: 14px; line-height: 1.5; max-height: 40vh; }
  [data-v4-composer-dock="true"] .send { width: 34px; height: 34px; border-radius: 50%; border: none; background: #9A9A9A; color: #0A0A0A; font-weight: 700; }

  /* ===== 真导航（默认折叠；注入后 logo 下拉会强制展开） ===== */
  nav[data-testid="v4-turn-navigator"] { position: fixed; left: 10px; top: 20%; width: 230px; max-height: 50vh;
    overflow-y: auto; background: #161616; border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 8px 0; }
  nav[data-testid="v4-turn-navigator"] .t { padding: 8px 12px; font-size: 12px; color: #B8B8B8; border-bottom: 1px solid rgba(255,255,255,0.06); }
  nav[data-testid="v4-turn-navigator"] .t:last-child { border-bottom: none; }
  nav[data-testid="v4-turn-navigator"] .t em { color: #C9C9C9; font-style: normal; margin-right: 6px; }

  /* ===== 控制条（预览专用，z-index 高于注入层） ===== */
  #ctl { position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 100001; background: #1A1A1A;
    border: 1px solid rgba(255,255,255,0.14); border-radius: 14px; padding: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    font-size: 12px; color: #B8B8B8; }
  #ctl h4 { margin: 0 0 6px; font-size: 12px; color: #F0F0F0; }
  #ctl .grp { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  #ctl button { border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.06); color: #F0F0F0;
    border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  #ctl button:active { background: rgba(255,255,255,0.16); }
  #ctl label { display: inline-flex; align-items: center; gap: 4px; margin-right: 8px; }
  #ctl .log { max-height: 40px; overflow-y: auto; color: #8F8F8F; font-size: 11px; }
  #ctl a { color: #C9C9C9; }
</style>
</head>
<body>
<div id="app">
  <header><span class="dot"></span><span>远控会话 · 预览页（模拟 z.ai 页面结构）</span></header>

  <div class="row assistant group/assistant-row" data-testid="v4-row-101">
    <div class="bubble">已就绪。这是一个<b>模拟聊天页</b>，bundle 注入后：<code>logo</code>（右上角 Z）、悬浮输入、导航面板、toast 都能实际操作。\n底部控制条用来模拟触摸手势（桌面浏览器没有 touch 事件）。</div>
  </div>
  <div class="row user group/user-row" data-testid="v4-row-102">
    <div class="bubble">试试下拉 logo 唤出导航面板？</div>
    <div class="ops"><button data-testid="v4-copy-102">复制</button><button data-testid="v4-edit-102">编辑</button></div>
  </div>
  <div class="row assistant group/assistant-row" data-testid="v4-row-103">
    <div class="bubble">```js\nconst preview = true;\nconsole.log('bundle 注入预览 OK');\n```</div>
    <div class="ops"><button data-testid="v4-copy-103">复制</button></div>
  </div>
</div>

<!-- 真导航（页面自带，默认折叠） -->
<nav data-testid="v4-turn-navigator" hidden>
  <div class="t"><em>1</em>已就绪。这是一个模拟聊天页…</div>
  <div class="t"><em>2</em>试试下拉 logo 唤出导航面板？</div>
  <div class="t"><em>3</em>bundle 注入预览 OK</div>
</nav>

<!-- 输入 dock（页面原生常驻底部输入框） -->
<div data-v4-composer-dock="true">
  <div data-testid="v4-composer">
    <div class="rounded-2xl">
      <textarea data-testid="v4-composer-input" placeholder="给 ZCode 发消息…"></textarea>
      <button class="send">↑</button>
    </div>
  </div>
</div>

<!-- 控制条 -->
<div id="ctl">
  <h4>预览控制 · bundle 已注入 <span id="st">…</span></h4>
  <div class="grp">
    <button onclick="simTap()">logo 单击</button>
    <button onclick="simDblTap()">logo 双击</button>
    <button onclick="simSwipe(true)">logo 下拉</button>
    <button onclick="simSwipe(false)">logo 上滑</button>
    <button onclick="simDrag()">logo 长按拖动</button>
    <button onclick="simTriSwipe()">诊断组合手势（左3上+右3下）</button>
  </div>
  <div class="grp">
    <button onclick="simNewReply()">模拟新回复</button>
    <button onclick="toggleRealNav()">移除/恢复真导航</button>
    <a href="settings_preview.html" target="_blank">设置页 mock →</a>
  </div>
  <div class="grp">
    <label><input type="checkbox" id="f_float" checked>浮动输入</label>
    <label><input type="checkbox" id="f_anim" checked>动效</label>
    <label><input type="checkbox" id="f_nav" checked>导航</label>
    <label><input type="checkbox" id="f_reply" checked>回复通知</label>
    <label><input type="checkbox" id="f_scroll" checked>隐藏滚动条</label>
    <button onclick="reloadWithFlags()">按勾选重新注入</button>
  </div>
  <div class="log" id="log"></div>
</div>

<script>
// ===== mock 原生桥（真机上由 AppBridge 提供） =====
window.zcodeBridge = {
  openSettings() { log('bridge: openSettings'); },
  saveLogoPos(x, y) { log('bridge: saveLogoPos ' + x.toFixed(2) + ',' + y.toFixed(2)); },
  getLogoPos() { return ''; },
  onTheme(r, g, b, dark) { log('bridge: onTheme ' + r + ',' + g + ',' + b + ' dark=' + dark); },
  onBars() {},
  onReply(text) { log('bridge: onReply → ' + text); },
  onProgress(text) { log('bridge: onProgress → ' + text); },
  getTrace() { return '[]'; },
};

// ===== 注入（与 WebActivity.injectMobileFix 相同形态） =====
// 简版 MOBILE_CSS（完整版在 WebActivity.kt）
const MOBILE_CSS = 'html, body { max-width: 100vw !important; overflow-x: hidden !important; } ' +
  'div, section, article, main { min-width: 0 !important; } ' +
  '[class*="overflow-y-auto"], [class*="overflow-auto"] { overflow-x: hidden !important; touch-action: pan-y !important; } ' +
  'pre { max-width: 100% !important; overflow-x: auto !important; } ' +
  'code, p, li, a { overflow-wrap: anywhere !important; }';
const SCROLLBAR_HIDDEN = '* { scrollbar-width: none !important; } ::-webkit-scrollbar { display: none !important; }';
const SCROLLBAR_SLIM = '* { scrollbar-width: thin !important; } ::-webkit-scrollbar { width: 3px !important; }';

function flags() {
  return {
    navOn: document.getElementById('f_nav').checked,
    replyOn: document.getElementById('f_reply').checked,
    floatInput: document.getElementById('f_float').checked,
    uiAnim: document.getElementById('f_anim').checked,
  };
}
async function inject() {
  try {
    const t = await fetch('../_bundle.js', { cache: 'no-store' }).then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status + '（需要 http 服务器打开，file:// 下 fetch 被浏览器禁止）');
      return r.text();
    });
    const fn = eval('(' + t + ')');
    const f = flags();
    const css = MOBILE_CSS + (document.getElementById('f_scroll').checked ? SCROLLBAR_HIDDEN : SCROLLBAR_SLIM);
    fn(css, f.navOn, f.replyOn, f.floatInput, f.uiAnim);
    document.getElementById('st').textContent = 'OK (v' + (window.__zcodeErrors || []).length + ' 错误)';
    setTimeout(() => {
      const logo = document.getElementById('zcode-logo');
      document.getElementById('st').textContent = 'OK · logo=' + (logo ? '在' : '无(浮动输入关)');
    }, 200);
    log('bundle 注入完成: ' + JSON.stringify(f));
  } catch (e) {
    document.getElementById('st').textContent = '注入失败';
    log('注入失败: ' + e.message);
  }
}
inject();

// ===== 触摸手势模拟（桌面无 touch 事件，合成 TouchEvent 派发） =====
function logoEl() { return document.getElementById('zcode-logo'); }
function touch(type, el, x, y) {
  const t = new Touch({ identifier: 1, target: el, clientX: x, clientY: y });
  const on = type === 'touchend' ? [] : [t];
  el.dispatchEvent(new TouchEvent(type, {
    bubbles: true, cancelable: true, touches: on, targetTouches: on, changedTouches: [t],
  }));
}
function logoPos() {
  const r = logoEl().getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}
function sleep(ms) { return new Promise(res => setTimeout(res, ms)); }

async function simTap() {
  const l = logoEl(); if (!l) return log('logo 不存在（浮动输入已关）');
  const p = logoPos();
  touch('touchstart', l, p.x, p.y);
  await sleep(60);
  touch('touchend', l, p.x, p.y);
}
async function simDblTap() {
  await simTap(); await sleep(150); await simTap();
}
async function simSwipe(down) {
  const l = logoEl(); if (!l) return log('logo 不存在');
  const p = logoPos(); const d = down ? 70 : -70;
  touch('touchstart', l, p.x, p.y);
  await sleep(30); touch('touchmove', l, p.x, p.y + d * 0.4);
  await sleep(30); touch('touchmove', l, p.x, p.y + d * 0.8);
  await sleep(30); touch('touchend', l, p.x, p.y + d);
}
async function simDrag() {
  const l = logoEl(); if (!l) return log('logo 不存在');
  const p = logoPos();
  touch('touchstart', l, p.x, p.y);
  await sleep(500);   // 长按 400ms 生效
  for (let i = 1; i <= 6; i++) {
    touch('touchmove', l, p.x + i * 20, p.y + i * 20);
    await sleep(40);
  }
  touch('touchend', l, p.x + 120, p.y + 120);
}
async function simTriSwipe() {
  // 新诊断手势：左缘上滑×3 + 右缘下滑×3（3.5s 窗口内）
  const target = document.body;
  for (let i = 0; i < 3; i++) {
    touch('touchstart', target, 10, 300);
    await sleep(30); touch('touchmove', target, 10, 240);
    await sleep(30); touch('touchmove', target, 10, 180);
    await sleep(30); touch('touchend', target, 10, 160);
    await sleep(200);
  }
  for (let i = 0; i < 3; i++) {
    touch('touchstart', target, window.innerWidth - 10, 160);
    await sleep(30); touch('touchmove', target, window.innerWidth - 10, 220);
    await sleep(30); touch('touchmove', target, window.innerWidth - 10, 280);
    await sleep(30); touch('touchend', target, window.innerWidth - 10, 300);
    await sleep(200);
  }
}
let navElSaved = null;
function toggleRealNav() {
  if (navElSaved) {
    document.body.appendChild(navElSaved);   // 恢复（hidden 属性仍在，依旧折叠）
    navElSaved = null;
    log('真导航已恢复 → logo 下拉走真导航展开');
  } else {
    const nav = document.querySelector('nav[data-testid="v4-turn-navigator"]');
    navElSaved = nav;
    nav.parentNode.removeChild(nav);
    log('真导航已移除 → logo 下拉走自建面板兜底');
  }
}
// 模拟流式新回复：插入行 + 两次文本增长，观察回复监听/通知
async function simNewReply() {
  const chat = document.getElementById('app');
  const row = document.createElement('div');
  row.className = 'row assistant';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  row.appendChild(bubble);
  chat.appendChild(row);
  const id = 1000 + Math.floor(Math.random() * 9000);
  row.setAttribute('data-testid', 'v4-row-' + id);
  row.classList.add('group/assistant-row');
  bubble.textContent = '模拟回复生成中';
  log('插入 v4-row-' + id + '（将出现 2 次流式增长）');
  await sleep(800);
  bubble.textContent = '模拟回复生成中…（这是流式内容，用于触发回复监听的行级 watch）';
  await sleep(800);
  bubble.textContent = '模拟回复完成：这是一条完整的模拟回复，watchRow 稳定 2 轮后会走发送链路。';
  const ops = document.createElement('div');
  ops.className = 'ops';
  const fb = document.createElement('button');
  fb.setAttribute('data-testid', 'v4-feedback-like-' + id);
  fb.textContent = '👍';
  ops.appendChild(fb);
  row.appendChild(ops);
}
function log(msg) {
  const el = document.getElementById('log');
  el.textContent = new Date().toLocaleTimeString() + ' ' + msg + '\n' + el.textContent;
}
function reloadWithFlags() {
  localStorage.setItem('zcode_preview_flags', JSON.stringify(flags()));
  location.reload();
}
(function () {
  try {
    const saved = JSON.parse(localStorage.getItem('zcode_preview_flags') || '{}');
    if (saved.navOn !== undefined) document.getElementById('f_nav').checked = saved.navOn;
    if (saved.replyOn !== undefined) document.getElementById('f_reply').checked = saved.replyOn;
    if (saved.floatInput !== undefined) document.getElementById('f_float').checked = saved.floatInput;
    if (saved.uiAnim !== undefined) document.getElementById('f_anim').checked = saved.uiAnim;
  } catch (e) {}
})();
</script>
</body>
</html>
